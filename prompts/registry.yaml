# Maps logical prompt names to template files + required variables

# Orchestrator Agent
WorkflowOrchestrator:
  template: v1/orchestrator_user.j2
  required_vars: [source_files, row_limit, target_schema_json, output_dir]

# Core Agents
DataPrepAgent:
  template: v1/dataprep_user.j2
  required_vars: [source_files, row_limit]

ColumnMappingAgent:
  template: v1/column_mapping_user.j2
  required_vars: [dataset_metadata_json, target_schema_json, mapped_dir]

DataIntegrationAgent:
  template: v1/integration_user.j2
  required_vars: [mapped_manifest_json, target_schema_json, output_path]

# Evaluation Agents for Core Agents
DataPrepEvaluationAgent:
  template: v1/data_prep_evaluation_user.j2
  required_vars: [agent_input, agent_output, expected_files]

ColumnMappingEvaluationAgent:
  template: v1/column_mapping_evaluation_user.j2
  required_vars: [agent_input, agent_output, mapping_plan_json, target_schema_json]

DataIntegrationEvaluationAgent:
  template: v1/data_integration_evaluation_user.j2
  required_vars: [agent_input, agent_output, source_row_count, final_row_count, final_dataset_path, target_schema_json, mapping_plan_json]