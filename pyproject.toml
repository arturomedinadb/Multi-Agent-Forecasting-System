[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai_forecasting_agents"
version = "0.1.0"
description = "AI-powered agent for end-to-end demand forecasting"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Katherine Gong"},
    {name = "Ayda Elzohbi"},
    {name = "Arturo Medina"},
    {name = "Arial Huang"},
]
maintainers = [
    {name = "Katherine Gong", email = "katherine.gong@example.com"},
]
keywords = [
    "ai", 
    "machine-learning", 
    "data-mapping", 
    "schema-transformation", 
    "demand-forecasting",
    "retail-analytics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.3.0",
    "openai>=1.100.0",
    "pydantic>=2.11.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pandera>=0.20.0",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.5.0",
    "deepeval>=0.22.0",
    "pyyaml>=6.0",
    "jinja2 (>=3.1.6,<4.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
]

[project.urls]
Homepage = "https://github.com/your-org/ai_forecasting_agents"
Documentation = "https://ai_forecasting_agents.readthedocs.io/"
Repository = "https://github.com/your-org/ai_forecasting_agents.git"
Issues = "https://github.com/your-org/ai_forecasting_agents/issues"
Changelog = "https://github.com/your-org/ai_forecasting_agents/blob/main/CHANGELOG.md"

[project.scripts]
schema-mapper = "src.ai_forecasting_agents.schema_mapping.run_workflow:main"
schema-mapping-eval = "mapping_system.schema_mapping.evaluation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_forecasting_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_api_key: marks tests that require OpenAI API key",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "tests"]

[tool.flake8]
max-line-length = 88
select = ["E", "F", "W", "C"]
ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
    "*.egg",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "openai_agents.*",
    "pandera.*",
]
ignore_missing_imports = true

[tool.poetry.dependencies]
jinja2 = "^3.1.4"

[tool.poetry]
packages = [{ include = "mapping_system", from = "src" }]